# Render Blueprint — wedding-planner
# Generated by software-factory onboarding. Customize as needed.
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: wedding-planner-api
    runtime: python
    rootDir: backend
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DATABASE_URL
        fromDatabase:
          name: wedding-planner-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://wedding-planner-frontend-c7a4.onrender.com"
      - key: FRONTEND_URL
        value: "https://wedding-planner-frontend-c7a4.onrender.com"
      - fromGroup: general_builder_keys

  - type: web
    name: wedding-planner-frontend
    runtime: node
    rootDir: frontend
    plan: starter
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - fromGroup: general_builder_keys

databases:
  - name: wedding-planner-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: 16
