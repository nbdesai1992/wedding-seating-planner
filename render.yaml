# IaC documentation — wedding-seating-planner (nealdes.ai workspace)
# Services were provisioned via the Render API (human-authorized, 2026-08-02),
# NOT a Blueprint Instance. This file documents the live configuration.
#
# No managed database: the API embeds SQLite (DATABASE_URL=sqlite:///./wedding.db).
# Data is EPHEMERAL — it resets on every deploy/restart/spin-down (free plan).
# Secrets (ANTHROPIC_API_KEY, CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY)
# come from the shared env group `general_builder_keys` linked to both services.

services:
  - type: web
    name: wedding-planner-api          # srv-d9ns6lfqj5pc73fhh9bg
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DATABASE_URL
        value: "sqlite:///./wedding.db"
      - fromGroup: general_builder_keys

  - type: web
    name: wedding-planner-frontend
    runtime: node
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: NEXT_PUBLIC_API_URL
        value: "https://wedding-planner-api-xnoq.onrender.com"
      - fromGroup: general_builder_keys
